<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retail Demo Landing Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f9ff;
    color:#111827;
}

.container{
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    background:#ffffff;
}

.header{
    padding:18px;
    border-bottom:1px solid #dbeafe;
}

.logo{
    font-size:24px;
    font-weight:700;
    color:#0053e2;
}

.hero{
    text-align:center;
    padding:40px 20px;
}

.hero h1{
    font-size:38px;
    line-height:1.1;
    margin-bottom:12px;
}

.hero p{
    color:#64748b;
}

.card{
    margin:12px 18px;
    padding:18px;
    border:1px solid #dbeafe;
    border-radius:12px;
    display:flex;
    gap:12px;
}

.icon{
    width:26px;
    height:26px;
    border-radius:50%;
    background:#0053e2;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.card h3{
    margin-bottom:4px;
}

.card p{
    color:#64748b;
    font-size:14px;
}

.button-wrap{
    padding:20px 18px;
}

.btn{
    width:100%;
    padding:18px;
    border:none;
    border-radius:10px;
    background:#0053e2;
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}
</style>
</head>
<body>

<div class="container">

    <div class="header">
        <div class="logo">Retail Brand</div>
    </div>

    <div class="hero">
        <h1>Blue Theme Demo Page</h1>
        <p>A simple example for learning responsive HTML and CSS.</p>
    </div>

    <div class="card">
        <div class="icon">1</div>
        <div>
            <h3>Step One</h3>
            <p>Learn layout structure with Flexbox.</p>
        </div>
    </div>

    <div class="card">
        <div class="icon">2</div>
        <div>
            <h3>Step Two</h3>
            <p>Customize colors, spacing, and typography.</p>
        </div>
    </div>

    <div class="card">
        <div class="icon">3</div>
        <div>
            <h3>Step Three</h3>
            <p>Practice responsive design techniques.</p>
        </div>
    </div>

    <div class="button-wrap">
        <button class="btn">Learn More</button>
    </div>

</div>

</body>
</html>
